[workspace]
members = [
    "crates/flow-plugin-fixture",
    "crates/flux-core",
    "crates/flux-launcher",
    "crates/flux-plugin-sdk",
    "crates/flux-plugin-example",
]
default-members = ["crates/flux-launcher"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["lvxingqi <lvxingqi2000@gmail.com>"]
repository = "https://github.com/lvxingqi/flux-launcher-cn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release-perf]
inherits = "release"
opt-level = 3
