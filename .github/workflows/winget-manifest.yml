name: WinGet Manifest 验证

on:
  push:
    branches: [main]
    paths:
      - "packaging/winget/manifests/**"
      - "scripts/generate-winget-manifest.ps1"
      - ".github/workflows/winget-manifest.yml"

  pull_request:
    paths:
      - "packaging/winget/manifests/**"
      - "scripts/generate-winget-manifest.ps1"
      - ".github/workflows/winget-manifest.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winget-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 更新 App Installer / WinGet
        shell: pwsh
        run: |
          winget upgrade `
            --id Microsoft.AppInstaller `
            --exact `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity

          $upgradeExitCode = $LASTEXITCODE

          Start-Sleep -Seconds 3

          $versionText = (winget --version).Trim().TrimStart("v")
          $version = [version]$versionText

          if ($version -lt [version]"1.12.0") {
            throw "WinGet $versionText is too old for schema 1.12 validation (exit code $upgradeExitCode)."
          }

          if ($upgradeExitCode -ne 0) {
            Write-Host "App Installer returned exit code $upgradeExitCode after the upgrade; continuing with WinGet $versionText."
          }

      - name: 验证 WinGet 版本
        shell: pwsh
        run: |
          winget --info

          $versionText = (winget --version).Trim().TrimStart("v")
          $version = [version]$versionText

          if ($version -lt [version]"1.12.0") {
            throw "WinGet $versionText is too old for schema 1.12 validation."
          }

      - name: 验证 WinGet Manifest
        shell: pwsh
        run: |
          $packageRoot = Resolve-Path "packaging/winget/manifests/l/lvxingqi/FluxLauncherCN"
          $manifestRoots = @(Get-ChildItem $packageRoot -Directory)

          if ($manifestRoots.Count -eq 0) {
            throw "未找到版本化 WinGet manifest 目录。"
          }

          foreach ($manifestRoot in $manifestRoots) {
            $manifestFiles = @(Get-ChildItem $manifestRoot.FullName -Filter "*.yaml" -File)

            if ($manifestFiles.Count -ne 3) {
              throw "目录 $($manifestRoot.FullName) 必须包含 3 个 manifest 文件，实际找到 $($manifestFiles.Count) 个。"
            }

            winget validate --manifest $manifestRoot.FullName
          }

      - name: 检查包标识与目录结构
        shell: pwsh
        run: |
          $packageRoot = Resolve-Path "packaging/winget/manifests/l/lvxingqi/FluxLauncherCN"
          $manifestRoots = @(Get-ChildItem $packageRoot -Directory)

          foreach ($manifestRoot in $manifestRoots) {
            if ($manifestRoot.Name -notmatch '^\d+\.\d+\.\d+$') {
              throw "非法 WinGet 版本目录：$($manifestRoot.Name)"
            }

            $manifests = Get-ChildItem $manifestRoot.FullName -Filter "*.yaml" -File
            $expectedNames = @(
              "lvxingqi.FluxLauncherCN.yaml",
              "lvxingqi.FluxLauncherCN.locale.en-US.yaml",
              "lvxingqi.FluxLauncherCN.installer.yaml"
            )
            $actualNames = @($manifests.Name | Sort-Object)

            if (Compare-Object $expectedNames $actualNames) {
              throw "目录 $($manifestRoot.FullName) 的 manifest 文件名不符合 lvxingqi.FluxLauncherCN。"
            }

            foreach ($manifest in $manifests) {
              $content = Get-Content $manifest.FullName -Raw

              if ($content -notmatch 'PackageIdentifier:\s*lvxingqi\.FluxLauncherCN') {
                throw "Manifest $($manifest.Name) 的 PackageIdentifier 不正确。"
              }
            }
          }

      - name: 核验稳定版安装程序
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $latestRelease = gh release list `
            --repo "${{ github.repository }}" `
            --limit 100 `
            --json tagName,isPrerelease,isDraft,publishedAt |
            ConvertFrom-Json |
            Where-Object {
              $_.isPrerelease -eq $false -and
              $_.isDraft -eq $false
            } |
            Sort-Object publishedAt -Descending |
            Select-Object -First 1

          if (-not $latestRelease) {
            throw "未找到稳定版 GitHub Release。"
          }

          $tag = $latestRelease.tagName
          Write-Host "Stable release: $tag"

          $release = gh release view $tag `
            --repo "${{ github.repository }}" `
            --json assets |
            ConvertFrom-Json

          $installer = $release.assets |
            Where-Object { $_.name -eq "FluxLauncherCN-Setup.exe" } |
            Select-Object -First 1

          if (-not $installer) {
            throw "稳定版 Release $tag 不包含 FluxLauncherCN-Setup.exe。"
          }

          $url = $installer.url
          $path = Join-Path $env:RUNNER_TEMP "FluxLauncherCN-Setup.exe"

          Invoke-WebRequest -Uri $url -OutFile $path

          $actual = (Get-FileHash $path -Algorithm SHA256).Hash

          Write-Host "Stable installer:"
          Write-Host "  Release: $tag"
          Write-Host "  URL: $url"
          Write-Host "  SHA256: $actual"

      - name: 验证稳定版安装程序存在对应 manifest
        shell: pwsh
        run: |
          $packageRoot = Resolve-Path "packaging/winget/manifests/l/lvxingqi/FluxLauncherCN"

          $versions = @(Get-ChildItem $packageRoot -Directory |
            Select-Object -ExpandProperty Name)

          if ($versions.Count -eq 0) {
            throw "未找到 WinGet 版本目录。"
          }

          Write-Host "Available WinGet versions:"
          $versions | ForEach-Object { Write-Host " - $_" }
